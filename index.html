<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>Client Demo Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel profile-panel">
        <div class="photo-wrap">
          <img id="profile-photo" src="./profile-photo.jpg" alt="Profile photo" />
          <div id="photo-fallback" class="photo-fallback">MM</div>
        </div>

        <div class="profile-head">
          <h1 id="profile-name">Your Name</h1>
          <div class="title-row">
            <span class="role" id="profile-title">Interactive Demo Creator</span>
          </div>

          <p class="intro" id="profile-tagline">
            Add your profile details in <code>profile.json</code> or <code>profile.example.json</code>.
          </p>

          <div class="contact-grid">
            <div class="contact-item">
              <span class="contact-label">Email</span>
              <a class="contact-value" id="profile-email" href="mailto:you@example.com">you@example.com</a>
            </div>
            <div class="contact-item">
              <span class="contact-label">Phone</span>
              <a class="contact-value" id="profile-phone" href="tel:+0000000000">+00 000 000 0000</a>
            </div>
            <div class="contact-item">
              <span class="contact-label">Location</span>
              <span class="contact-value" id="profile-location">Your City</span>
            </div>
          </div>

          <div class="quick-links" id="profile-links"></div>
        </div>
      </section>

      <section class="panel demos-panel">
        <div class="demos-head">
          <h2>Demos</h2>
          <span class="count-pill" id="visible-count">Showing 0 of 0</span>
        </div>

        <div class="search-wrap">
          <label for="demo-search" class="contact-label">Find a demo</label>
          <input id="demo-search" type="search" placeholder="Type a demo name..." autocomplete="off" />
        </div>

        <ul class="demos-list" id="demos-list"></ul>
        <p class="status" id="manifest-status" hidden></p>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
